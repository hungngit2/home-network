- id: '1781580392967'
  alias: Bike Overcharge Cutoff
  description: Turn off bike charger when power drops below 10W for 1 minute.
  triggers:
  - type: power
    device_id: 01523d6cb975fbc9ef844ed4331409d4
    entity_id: b6731993b5fb757901d4f90b3f6dedf6
    domain: sensor
    trigger: device
    below: 10
    for:
      hours: 0
      minutes: 1
      seconds: 0
  conditions: []
  actions:
  - type: turn_off
    device_id: 01523d6cb975fbc9ef844ed4331409d4
    entity_id: 2cc28aefed6d2ddd22cc970e48a0e9ac
    domain: switch
  mode: single
- id: luxpower_offgrid_close_grid_protector_30pct
  alias: 'Solar Off-Grid: Close Grid Protector at <= 30% SOC'
  description: Close Grid Protector when Battery SOC drops to 30% or below.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.luxpower_inverter_battery_battery_soc
    below: 31
    for:
      hours: 0
      minutes: 0
      seconds: 20
  - trigger: homeassistant
    event: start
  conditions:
  - condition: numeric_state
    entity_id: sensor.luxpower_inverter_battery_battery_soc
    below: 31
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.grid_protector
  mode: single
- id: luxpower_offgrid_open_grid_protector_40pct
  alias: 'Solar Off-Grid: Open Grid Protector at >= 40% SOC'
  description: Open Grid Protector when Battery SOC recovers to 40% or above.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.luxpower_inverter_battery_battery_soc
    above: 39
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - trigger: homeassistant
    event: start
  conditions:
  - condition: numeric_state
    entity_id: sensor.luxpower_inverter_battery_battery_soc
    above: 39
  - condition: numeric_state
    entity_id: sensor.luxpower_inverter_load_power
    below: 4000
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.grid_protector
  mode: single
- id: alert_low_battery_soc
  alias: 'Alert: Low Battery SOC'
  description: Send notification when battery drops to 35% or lower.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.luxpower_inverter_battery_battery_soc
    below: 36
  actions:
  - action: notify.mobile_app_hung_s_iphonese2
    data:
      title: Low Battery Warning
      message: Battery is at {{ states('sensor.luxpower_inverter_battery_battery_soc')
        }}%. Grid fallback closes at 30%.
    continue_on_error: true
  - action: notify.mobile_app_mais_iphone16p
    continue_on_error: true
    data:
      title: Low Battery Warning
      message: Battery is at {{ states('sensor.luxpower_inverter_battery_battery_soc')
        }}%. Grid fallback closes at 30%.
  mode: single
- id: alert_grid_protector_closed
  alias: 'Alert: Grid Protector Engaged'
  description: Send notification when grid fallback breaker turns on.
  triggers:
  - trigger: state
    entity_id: switch.grid_protector
    from: 'off'
    to: 'on'
  actions:
  - action: notify.mobile_app_hung_s_iphonese2
    data:
      title: Grid Fallback Active
      message: House is now on grid power. Battery {{ states('sensor.luxpower_inverter_battery_battery_soc')
        }}%, load {{ states('sensor.luxpower_inverter_load_power') | int(0) }} W of
        6500 W.
    continue_on_error: true
  - action: notify.mobile_app_mais_iphone16p
    continue_on_error: true
    data:
      title: Grid Fallback Active
      message: House is now on grid power. Battery {{ states('sensor.luxpower_inverter_battery_battery_soc')
        }}%, load {{ states('sensor.luxpower_inverter_load_power') | int(0) }} W of
        6500 W.
  mode: single
- id: alert_inverter_fault
  alias: 'Alert: Inverter Fault or Warning'
  description: Notify when the LuxPower inverter reports a fault or warning.
  triggers:
  - trigger: state
    entity_id:
    - sensor.luxpower_inverter_active_fault_text
    - sensor.luxpower_inverter_active_warning_text
    not_to:
    - No Faults
    - No Warnings
    - unavailable
    - unknown
    for:
      seconds: 30
  actions:
  - action: notify.mobile_app_hung_s_iphonese2
    data:
      title: Inverter Alert
      message: '{{ trigger.to_state.name }}: {{ trigger.to_state.state }}'
    continue_on_error: true
  - action: notify.mobile_app_mais_iphone16p
    continue_on_error: true
    data:
      title: Inverter Alert
      message: '{{ trigger.to_state.name }}: {{ trigger.to_state.state }}'
  mode: queued
- id: alert_inverter_offline
  alias: 'Alert: Inverter Offline'
  description: Notify when the inverter stops reporting for 10 minutes.
  triggers:
  - trigger: state
    entity_id: sensor.luxpower_inverter_battery_battery_soc
    to: unavailable
    for:
      minutes: 10
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: sensor.luxpower_inverter_battery_battery_soc
    state: unavailable
  actions:
  - action: notify.mobile_app_hung_s_iphonese2
    data:
      title: Inverter Offline
      message: No data from the LuxPower inverter for 10 minutes. Check the dongle
        and network.
    continue_on_error: true
  - action: notify.mobile_app_mais_iphone16p
    continue_on_error: true
    data:
      title: Inverter Offline
      message: No data from the LuxPower inverter for 10 minutes. Check the dongle
        and network.
  mode: single
- id: grid_assist_high_load_close
  alias: 'Solar Off-Grid: Close Grid Protector on high load'
  description: 'Inverter is 6.5 kW: connect the grid when the home load stays above
    5.5 kW so grid and inverter share it (Take Load Together).'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.luxpower_inverter_load_power
    above: 5500
    for:
      seconds: 5
  conditions:
  - condition: state
    entity_id: switch.grid_protector
    state: 'off'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.grid_protector
  mode: single
- id: grid_assist_high_load_release
  alias: 'Solar Off-Grid: Open Grid Protector after high load'
  description: Disconnect the grid again once the load has stayed below 4 kW for 5
    minutes, but only if the battery is above the 40% fallback level.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.luxpower_inverter_load_power
    below: 4000
    for:
      minutes: 5
  conditions:
  - condition: state
    entity_id: switch.grid_protector
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.luxpower_inverter_battery_battery_soc
    above: 39
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.grid_protector
  mode: single
- id: alert_grid_outage
  alias: 'Alert: Grid Power Outage'
  description: 'EVN supply lost: the grid protector (supply side) reads under 150
    V for 1 min, or is offline for 5 min (longer than an HA restart).'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.grid_protector_voltage_a
    below: 150
    for:
      minutes: 1
  - trigger: state
    entity_id: sensor.grid_protector_voltage_a
    to: unavailable
    for:
      minutes: 5
  conditions:
  - condition: state
    entity_id: input_boolean.grid_outage
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.grid_outage
  - action: notify.mobile_app_hung_s_iphonese2
    continue_on_error: true
    data:
      title: Grid power outage
      message: 'EVN power is off. The house runs on battery: {{ states(''sensor.luxpower_inverter_battery_battery_soc'')
        }}%{% if has_value(''sensor.battery_runtime'') %}, about {{ states(''sensor.battery_runtime'')
        }} h to {{ states(''number.luxpower_inverter_battery_off_grid_cut_off_soc'') | int(10) }}%{% endif %}. The grid fallback cannot help until power returns.'
  - action: notify.mobile_app_mais_iphone16p
    continue_on_error: true
    data:
      title: Grid power outage
      message: 'EVN power is off. The house runs on battery: {{ states(''sensor.luxpower_inverter_battery_battery_soc'')
        }}%{% if has_value(''sensor.battery_runtime'') %}, about {{ states(''sensor.battery_runtime'')
        }} h to {{ states(''number.luxpower_inverter_battery_off_grid_cut_off_soc'') | int(10) }}%{% endif %}. The grid fallback cannot help until power returns.'
  mode: single
- id: alert_grid_restored
  alias: 'Alert: Grid Power Restored'
  description: 'EVN supply back: the grid protector reads over 190 V for 2 minutes
    after an outage alert.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.grid_protector_voltage_a
    above: 190
    for:
      minutes: 2
  conditions:
  - condition: state
    entity_id: input_boolean.grid_outage
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.grid_outage
  - action: notify.mobile_app_hung_s_iphonese2
    continue_on_error: true
    data:
      title: Grid power restored
      message: EVN power is back ({{ states('sensor.grid_protector_voltage_a') | int(0)
        }} V). Battery {{ states('sensor.luxpower_inverter_battery_battery_soc') }}%.
  - action: notify.mobile_app_mais_iphone16p
    continue_on_error: true
    data:
      title: Grid power restored
      message: EVN power is back ({{ states('sensor.grid_protector_voltage_a') | int(0)
        }} V). Battery {{ states('sensor.luxpower_inverter_battery_battery_soc') }}%.
  mode: single
- id: kitchen_fan_speed_on_switch
  alias: Kitchen fan speed when the switch turns on
  description: The fan boots in an unknown state when its wall switch turns on, so
    send the speed (default 2) over local RF through the 1B hub, then once more in
    case the first was missed.
  triggers:
  - trigger: state
    entity_id: switch.fan_switch
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - variables:
      percentage: '{{ ((state_attr(''fan.kitchen_fan'', ''next_speed'') | int(2))
        * 100 / 6) | round(0) }}'
  - delay:
      seconds: 2
  - action: fan.turn_on
    target:
      entity_id: fan.kitchen_fan
    data:
      percentage: '{{ percentage }}'
  mode: restart
