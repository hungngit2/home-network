
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Batch DB writes (default 5s) to cut flash wear; drop raw MQTT hex debug sensors from history
recorder:
  commit_interval: 30
  exclude:
    entity_globs:
      - sensor.*_last_raw_mqtt_hex

template:
  - sensor:
      - name: "Main Meter Energy kWh"
        unique_id: main_meter_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.meter_protector_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.meter_protector_energy') }}"
      - name: "Ground Floor Energy kWh"
        unique_id: cb_ground_floor_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.cb_ground_floor_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.cb_ground_floor_energy') }}"
      - name: "Floor 1 Energy kWh"
        unique_id: cb_floor_1_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.cb_floor_1_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.cb_floor_1_energy') }}"
      - name: "Floor 2 Energy kWh"
        unique_id: cb_floor_2_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.cb_floor_2_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.cb_floor_2_energy') }}"
      - name: "Refrigerator Energy kWh"
        unique_id: refrigerator_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.refrigerator_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.refrigerator_energy') }}"
      - name: "Chest Freezer Energy kWh"
        unique_id: mosquito_repellent_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.mosquito_repellent_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.mosquito_repellent_energy') }}"
      - name: "Bike Charger Energy kWh"
        unique_id: sac_xe_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.sac_xe_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.sac_xe_energy') }}"
      - name: "Mosquito Liquid Energy kWh"
        unique_id: mosquito_liquid_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.mosquito_liquid_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.mosquito_liquid_energy') }}"
      - name: "Battery Status"
        unique_id: battery_status
        icon: >-
          {% set f = states('sensor.luxpower_inverter_battery_battery_flow') | float(0) %}
          {{ 'mdi:battery-charging' if f < -30 else 'mdi:battery-arrow-down' if f > 30 else 'mdi:battery' }}
        state: >-
          {% set f = states('sensor.luxpower_inverter_battery_battery_flow') | float(0) %}
          {% if f < -30 %}Charging {{ (-f) | int }} W{% elif f > 30 %}Discharging {{ f | int }} W{% else %}Idle{% endif %}
        availability: "{{ has_value('sensor.luxpower_inverter_battery_battery_flow') }}"
      # 16.08 kWh = energy-dashboard battery capacity; 30% = grid-fallback automation threshold
      - name: "Battery Runtime"
        unique_id: battery_runtime
        unit_of_measurement: "h"
        icon: mdi:timer-sand
        state: >-
          {% set soc = states('sensor.luxpower_inverter_battery_battery_soc') | float(0) %}
          {% set kw = states('sensor.luxpower_inverter_battery_battery_flow') | float(0) / 1000 %}
          {{ ((soc - 30) / 100 * 16.08 / kw) | round(1) }}
        availability: >-
          {{ has_value('sensor.luxpower_inverter_battery_battery_soc')
             and states('sensor.luxpower_inverter_battery_battery_soc') | float(0) > 30
             and states('sensor.luxpower_inverter_battery_battery_flow') | float(0) > 50 }}
  - button:
      - name: "1B Fan Light Light on/off"
        unique_id: 1b_fan_light_rf_light_power
        icon: "mdi:lightbulb"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: light_power
      - name: "1B Fan Light Power off"
        unique_id: 1b_fan_light_rf_power
        icon: "mdi:power"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: power
      - name: "1B Fan Light Reverse rotation"
        unique_id: 1b_fan_light_rf_fan_power
        icon: "mdi:rotate-3d-variant"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: fan_power
      - name: "1B Fan Light Fan speed 1"
        unique_id: 1b_fan_light_rf_fan_speed1
        icon: "mdi:fan"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: fan_speed1
      - name: "1B Fan Light Fan speed 2"
        unique_id: 1b_fan_light_rf_fan_speed2
        icon: "mdi:fan"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: fan_speed2
      - name: "1B Fan Light Fan speed 3"
        unique_id: 1b_fan_light_rf_fan_speed3
        icon: "mdi:fan"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: fan_speed3
      - name: "1B Fan Light Fan speed 4"
        unique_id: 1b_fan_light_rf_fan_speed4
        icon: "mdi:fan"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: fan_speed4
      - name: "1B Fan Light Fan speed 5"
        unique_id: 1b_fan_light_rf_fan_speed5
        icon: "mdi:fan"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: fan_speed5
      - name: "1B Fan Light Fan speed 6"
        unique_id: 1b_fan_light_rf_fan_speed6
        icon: "mdi:fan"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: fan_speed6
      - name: "1B Fan Light Sleep wind"
        unique_id: 1b_fan_light_rf_sleep_wind
        icon: "mdi:weather-night"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: sleep_wind
      - name: "1B Fan Light Natural wind"
        unique_id: 1b_fan_light_rf_natural_wind
        icon: "mdi:weather-windy"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: natural_wind
      - name: "1B Fan Light Timer 1h"
        unique_id: 1b_fan_light_rf_timer_1h
        icon: "mdi:timer-outline"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: timer_1h
      - name: "1B Fan Light Timer 2h"
        unique_id: 1b_fan_light_rf_timer_2h
        icon: "mdi:timer-outline"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: timer_2h
      - name: "1B Fan Light Timer 4h"
        unique_id: 1b_fan_light_rf_timer_4h
        icon: "mdi:timer-outline"
        press:
          - action: remote.send_command
            target:
              entity_id: remote.1b_infrared_rf
            data:
              device: fan_light
              command: timer_4h
      - name: "Kitchen Fan Timer"
        unique_id: kitchen_fan_timer_cycle
        icon: "mdi:timer-outline"
        press:
          - variables:
              next: >-
                {{ {'none': '1h', '1h': '2h', '2h': '4h', '4h': '1h'}.get(states('input_select.kitchen_fan_timer'), '1h') }}
          - action: button.press
            target:
              entity_id: "button.1b_fan_light_timer_{{ next }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.kitchen_fan_timer
            data:
              option: "{{ next }}"
      - name: "Kitchen Fan Wind"
        unique_id: kitchen_fan_wind_cycle
        icon: "mdi:weather-windy"
        press:
          - variables:
              next: >-
                {{ {'none': 'natural', 'natural': 'sleep', 'sleep': 'none'}.get(states('input_select.kitchen_fan_preset'), 'natural') }}
              speed: "{{ [1, states('input_number.kitchen_fan_speed') | int(3)] | max }}"
          - if: "{{ next == 'none' }}"
            then:
              - action: button.press
                target:
                  entity_id: "button.1b_fan_light_fan_speed_{{ speed }}"
              - action: input_select.select_option
                target:
                  entity_id: input_select.kitchen_fan_preset
                data:
                  option: "none"
            else:
              - action: fan.set_preset_mode
                target:
                  entity_id: fan.kitchen_fan
                data:
                  preset_mode: "{{ next }}"
  - fan:
      - name: "Kitchen Fan"
        unique_id: kitchen_fan_rf
        state: "{{ is_state('switch.fan_switch', 'on') and is_state('input_boolean.kitchen_fan_running', 'on') }}"
        availability: "{{ has_value('switch.fan_switch') }}"
        speed_count: 6
        percentage: >-
          {{ ((states('input_number.kitchen_fan_speed') | int(0)) * 100 / 6) | round(0)
             if is_state('switch.fan_switch', 'on') and is_state('input_boolean.kitchen_fan_running', 'on') else 0 }}
        preset_modes:
          - natural
          - sleep
        preset_mode: >-
          {{ none if is_state('input_select.kitchen_fan_preset', 'none')
             else states('input_select.kitchen_fan_preset') }}
        direction: "{{ 'reverse' if is_state('input_boolean.kitchen_fan_reverse', 'on') else 'forward' }}"
        turn_on:
          - variables:
              speed: >-
                {{ [1, ((percentage | int(0)) * 6 / 100) | round(0, 'ceil') | int] | max
                   if percentage is defined and percentage else 3 }}
          - if: "{{ is_state('switch.fan_switch', 'off') }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.kitchen_fan_next_speed
                data:
                  value: "{{ speed }}"
              - action: switch.turn_on
                target:
                  entity_id: switch.fan_switch
            else:
              - action: button.press
                target:
                  entity_id: "button.1b_fan_light_fan_speed_{{ speed }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.kitchen_fan_speed
                data:
                  value: "{{ speed }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.kitchen_fan_running
        turn_off:
          - action: button.press
            target:
              entity_id: button.1b_fan_light_power_off
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.kitchen_fan_running
          - action: input_select.select_option
            target:
              entity_id: input_select.kitchen_fan_timer
            data:
              option: "none"
        set_percentage:
          - variables:
              speed: "{{ ((percentage | int(0)) * 6 / 100) | round(0, 'ceil') | int }}"
          - choose:
              - conditions: "{{ speed == 0 }}"
                sequence:
                  - action: button.press
                    target:
                      entity_id: button.1b_fan_light_power_off
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.kitchen_fan_running
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.kitchen_fan_timer
                    data:
                      option: "none"
              - conditions: "{{ is_state('switch.fan_switch', 'off') }}"
                sequence:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.kitchen_fan_next_speed
                    data:
                      value: "{{ speed }}"
                  - action: switch.turn_on
                    target:
                      entity_id: switch.fan_switch
            default:
              - action: button.press
                target:
                  entity_id: "button.1b_fan_light_fan_speed_{{ speed }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.kitchen_fan_speed
                data:
                  value: "{{ speed }}"
              - action: input_select.select_option
                target:
                  entity_id: input_select.kitchen_fan_preset
                data:
                  option: "none"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.kitchen_fan_running
        set_preset_mode:
          - action: button.press
            target:
              entity_id: "button.1b_fan_light_{{ 'natural_wind' if preset_mode == 'natural' else 'sleep_wind' }}"
          - action: input_select.select_option
            target:
              entity_id: input_select.kitchen_fan_preset
            data:
              option: "{{ preset_mode }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.kitchen_fan_running
        set_direction:
          - if: "{{ (direction == 'reverse') != is_state('input_boolean.kitchen_fan_reverse', 'on') }}"
            then:
              - action: button.press
                target:
                  entity_id: button.1b_fan_light_reverse_rotation
              - action: input_boolean.toggle
                target:
                  entity_id: input_boolean.kitchen_fan_reverse

input_number:
  kitchen_fan_speed:
    name: Kitchen fan speed
    min: 0
    max: 6
    step: 1
    icon: mdi:fan
  kitchen_fan_next_speed:
    name: Kitchen fan speed at next switch-on
    min: 1
    max: 6
    step: 1
    initial: 3
    icon: mdi:fan-clock

input_select:
  kitchen_fan_preset:
    name: Kitchen fan preset
    options:
      - "none"
      - natural
      - sleep
    icon: mdi:weather-windy
  kitchen_fan_timer:
    name: Kitchen fan timer
    options:
      - "none"
      - 1h
      - 2h
      - 4h
    icon: mdi:timer-outline

input_boolean:
  kitchen_fan_running:
    name: Kitchen fan running
    icon: mdi:fan
  kitchen_fan_reverse:
    name: Kitchen fan reversed
    icon: mdi:rotate-3d-variant
