
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Batch DB writes (default 5s) to cut flash wear; drop raw MQTT hex debug sensors from history
recorder:
  commit_interval: 30
  exclude:
    entity_globs:
      - sensor.*_last_raw_mqtt_hex

template:
  - sensor:
      - name: "Main Meter Energy kWh"
        unique_id: main_meter_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.meter_protector_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.meter_protector_energy') }}"
      - name: "Ground Floor Energy kWh"
        unique_id: cb_ground_floor_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.cb_ground_floor_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.cb_ground_floor_energy') }}"
      - name: "Floor 1 Energy kWh"
        unique_id: cb_floor_1_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.cb_floor_1_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.cb_floor_1_energy') }}"
      - name: "Floor 2 Energy kWh"
        unique_id: cb_floor_2_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.cb_floor_2_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.cb_floor_2_energy') }}"
      - name: "Refrigerator Energy kWh"
        unique_id: refrigerator_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.refrigerator_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.refrigerator_energy') }}"
      - name: "Chest Freezer Energy kWh"
        unique_id: mosquito_repellent_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.mosquito_repellent_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.mosquito_repellent_energy') }}"
      - name: "Bike Charger Energy kWh"
        unique_id: sac_xe_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.sac_xe_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.sac_xe_energy') }}"
      - name: "Mosquito Liquid Energy kWh"
        unique_id: mosquito_liquid_energy_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ (states('sensor.mosquito_liquid_energy') | float(0)) / 1000 }}"
        availability: "{{ has_value('sensor.mosquito_liquid_energy') }}"
      - name: "Battery Status"
        unique_id: battery_status
        icon: >-
          {% set f = states('sensor.luxpower_inverter_battery_battery_flow') | float(0) %}
          {{ 'mdi:battery-charging' if f < -30 else 'mdi:battery-arrow-down' if f > 30 else 'mdi:battery' }}
        state: >-
          {% set f = states('sensor.luxpower_inverter_battery_battery_flow') | float(0) %}
          {% if f < -30 %}Charging {{ (-f) | int }} W{% elif f > 30 %}Discharging {{ f | int }} W{% else %}Idle{% endif %}
        availability: "{{ has_value('sensor.luxpower_inverter_battery_battery_flow') }}"
      # 16.08 kWh = energy-dashboard battery capacity; 30% = grid-fallback automation threshold
      - name: "Battery Runtime"
        unique_id: battery_runtime
        unit_of_measurement: "h"
        icon: mdi:timer-sand
        state: >-
          {% set soc = states('sensor.luxpower_inverter_battery_battery_soc') | float(0) %}
          {% set kw = states('sensor.luxpower_inverter_battery_battery_flow') | float(0) / 1000 %}
          {{ ((soc - 30) / 100 * 16.08 / kw) | round(1) }}
        availability: >-
          {{ has_value('sensor.luxpower_inverter_battery_battery_soc')
             and states('sensor.luxpower_inverter_battery_battery_soc') | float(0) > 30
             and states('sensor.luxpower_inverter_battery_battery_flow') | float(0) > 50 }}
      - name: "PV Forecast Today"
        unique_id: pv_forecast_today
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:solar-power-variant
        state: "{{ (states('sensor.energy_production_today') | float(0) + states('sensor.energy_production_today_2') | float(0)) | round(2) }}"
        availability: "{{ has_value('sensor.energy_production_today') and has_value('sensor.energy_production_today_2') }}"
      - name: "PV Forecast Remaining Today"
        unique_id: pv_forecast_remaining_today
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:solar-power-variant
        state: "{{ (states('sensor.energy_production_today_remaining') | float(0) + states('sensor.energy_production_today_remaining_2') | float(0)) | round(2) }}"
        availability: "{{ has_value('sensor.energy_production_today_remaining') and has_value('sensor.energy_production_today_remaining_2') }}"
      - name: "PV Forecast Tomorrow"
        unique_id: pv_forecast_tomorrow
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:solar-power-variant
        state: "{{ (states('sensor.energy_production_tomorrow') | float(0) + states('sensor.energy_production_tomorrow_2') | float(0)) | round(2) }}"
        availability: "{{ has_value('sensor.energy_production_tomorrow') and has_value('sensor.energy_production_tomorrow_2') }}"
