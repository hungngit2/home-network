server:
    port: 5335

    # Enable caching
    msg-cache-size: 50m         # Cache size for DNS messages
    rrset-cache-size: 100m      # Cache size for resource record sets
    cache-max-ttl: 86400        # Maximum time to keep cached entries (1 day)
    cache-min-ttl: 3600         # Minimum time to keep cached entries (1 hour)
    serve-expired: yes          # Serve expired cache entries if upstream is slow
